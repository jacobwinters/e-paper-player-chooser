<head>
<title>E-paper player chooser</title>
<meta name="viewport" content="width=device-width" />
<link rel="manifest" href='data:application/manifest+json,{"name":"E-paper player chooser","start_url":"./","display":"fullscreen","icons":[{"src":"icon.png","sizes":"any"}]}' />
</head>
<body style="pointer-events: none">
<span>Place your <strong>FINGERS</strong> on the <strong>DEVICE</strong></span>
<script><![CDATA[
let randItem = (arr) => arr[~~(Math.random() * arr.length)];
let circles = {};
let arrows = [];
let timeout;

onpointerdown = (e) => {
	clearArrows();
	document.querySelector("span")?.remove();
	let img = new Image();
	img.src = randItem(circleImgs);
	Object.assign(img.style, {
		position: "fixed",
		top: e.clientY + "px",
		left: e.clientX + "px",
		translate: "-50% -50%",
		rotate: Math.random() + "turn",
	});
	document.body.append(img);
	circles[e.pointerId] = img;
	clearTimeout(timeout);
	timeout = setTimeout(finish, 2000);
};

onpointerup = onpointercancel = (e) => {
	if (circles[e.pointerId]) {
		circles[e.pointerId].remove();
		delete circles[e.pointerId];
	}
};

function clearArrows() {
	for (let a of arrows) a.remove();
	arrows = [];
}

function finish() {
	if (!Object.values(circles).length) return;
	let chosen = randItem(Object.values(circles));
	for (let c of Object.values(circles)) c.remove();
	circles = {};
	navigator.vibrate?.(250);
	for (let i = 0; i < 7; i++) {
		let img = new Image();
		img.src = randItem(arrowImgs);
		Object.assign(img.style, {
			position: "fixed",
			top: chosen.style.top,
			left: chosen.style.left,
			transform: `translate(0, -50%) rotate(${i / 7}turn) translate(50px, 0) scaleY(${Math.random() < 0.5 ? -1 : 1})`,
			transformOrigin: "center left",
		});
		document.body.append(img);
		arrows.push(img);
	}
	timeout = setTimeout(clearArrows, 2000);
}
